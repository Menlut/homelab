services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: "no"
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE}"
      OLLAMA_MAX_LOADED_MODELS: "${OLLAMA_MAX_LOADED_MODELS}"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL}"
    volumes:
      - ./data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - ai-services-network

networks:
  ai-services-network:
    external: true
