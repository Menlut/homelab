services:
  arr-gluetun:
    image: qmcgaw/gluetun:latest
    container_name: arr-gluetun
    restart: "no"
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      - VPN_PORT_FORWARDING=on
      - SERVER_COUNTRIES=${VPN_SERVER_COUNTRIES}
      - TZ=${TZ}
      - 'HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE={"auth":"none"}'
    ports:
      - "8080:8080"
      - "9696:9696"
      - "7878:7878"
      - "8989:8989"
      - "6767:6767"
      - "4000:3000"
    volumes:
      - ./arr-gluetundata:/gluetun
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  arr-gluetun-webui:
    image: scuzza/gluetun-webui:latest
    restart: "no"
    container_name: arr-gluetun-webui
    network_mode: "service:arr-gluetun"
    environment:
      - GLUETUN_CONTROL_URL=http://localhost:8000
    depends_on:
      arr-gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m

  arr-qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: arr-qbittorrent
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./arr-qbittorrentconfig:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      arr-gluetun:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  arr-port-sync:
    image: mjmeli/qbittorrent-port-forward-gluetun-server:latest
    container_name: arr-port-sync
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - QBT_USERNAME=${QBT_USER}
      - QBT_PASSWORD=${QBT_PASS}
      - QBT_ADDR=http://localhost:8080
      - GTN_ADDR=http://localhost:8000
    depends_on:
      arr-gluetun:
        condition: service_healthy
      arr-qbittorrent:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 32m

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./prowlarrconfig:/config
    depends_on:
      arr-gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
        reservations:
          memory: 256m

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./sonarrconfig:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      arr-gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 384m

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./radarrconfig:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      arr-gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 384m

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    restart: "no"
    network_mode: "service:arr-gluetun"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ./bazarrconfig:/config
      - ${MEDIA_PATH}:/media
    depends_on:
      arr-gluetun:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1250m
        reservations:
          memory: 384m
