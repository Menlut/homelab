services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile
    image: caddy-cloudflare:local
    container_name: caddy
    restart: always
    network_mode: host
    env_file:
      - .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
