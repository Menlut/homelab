services:

  ###########################################################
  # Wardrowbe Database
  ###########################################################
  postgres:
    image: postgres:15-alpine
    container_name: wardrobe-db
    restart: "no"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wardrowbe-network
      - database-admin-network


  ###########################################################
  # Wardrowbe Redis
  ###########################################################
  redis:
    image: redis:7-alpine
    container_name: wardrobe-redis
    restart: "no"
    volumes:
      - ./redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wardrowbe-network


  ###########################################################
  # Wardrowbe Backend
  ###########################################################
  backend:
    image: ghcr.io/anyesh/wardrowbe:backend-latest
    container_name: wardrobe-backend
    restart: "no"
    environment:
      DEBUG: "${DEBUG}"
      PUID: "${PUID}"
      PGID: "${PGID}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      SECRET_KEY: "${SECRET_KEY}"
      CORS_ORIGINS: "${CORS_ORIGINS}"
      STORAGE_PATH: "/data/wardrobe"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      AUTH_TRUST_HEADER: "${AUTH_TRUST_HEADER}"
      AI_BASE_URL: "${AI_BASE_URL}"
      AI_VISION_MODEL: "${AI_VISION_MODEL}"
      AI_TEXT_MODEL: "${AI_TEXT_MODEL}"
      AI_TIMEOUT: "${AI_TIMEOUT}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES}"
      AI_INTERNAL_ENABLED: "${AI_INTERNAL_ENABLED}"
      AI_VISION_ENABLED: "${AI_VISION_ENABLED}"
      AI_TEXT_ENABLED: "${AI_TEXT_ENABLED}"
    ports:
      - "8087:8000"
    volumes:
      - ./wardrobe_data:/data/wardrobe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/api/v1/health
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - wardrowbe-network
      - ai-services-network


  ###########################################################
  # Wardrowbe Frontend
  ###########################################################
  frontend:
    image: ghcr.io/anyesh/wardrowbe:frontend-latest
    container_name: wardrobe-frontend
    restart: "no"
    environment:
      BACKEND_URL: "http://backend:8000"
      NEXTAUTH_URL: "${NEXTAUTH_URL}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      DEV_MODE: "${DEBUG}"
      OIDC_ISSUER_URL: "${OIDC_ISSUER_URL}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET}"
      PUID: "${PUID}"
      PGID: "${PGID}"
    ports:
      - "3010:3000"
    depends_on:
      - backend
    networks:
      - wardrowbe-network


  ###########################################################
  # Wardrowbe Worker
  ###########################################################
  worker:
    image: ghcr.io/anyesh/wardrowbe:backend-latest
    container_name: wardrobe-worker
    restart: "no"
    command: arq app.workers.worker.WorkerSettings
    environment:
      PUID: "${PUID}"
      PGID: "${PGID}"
      DATABASE_URL: "postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: "redis://redis:6379/0"
      STORAGE_PATH: "/data/wardrobe"
      AI_BASE_URL: "${AI_BASE_URL}"
      AI_VISION_MODEL: "${AI_VISION_MODEL}"
      AI_TEXT_MODEL: "${AI_TEXT_MODEL}"
      AI_TIMEOUT: "${AI_TIMEOUT}"
      AI_MAX_RETRIES: "${AI_MAX_RETRIES}"
      AI_API_KEY: "${AI_API_KEY}"
      AI_INTERNAL_ENABLED: "${AI_INTERNAL_ENABLED}"
      AI_VISION_ENABLED: "${AI_VISION_ENABLED}"
      AI_TEXT_ENABLED: "${AI_TEXT_ENABLED}"
    volumes:
      - ./wardrobe_data:/data/wardrobe
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - wardrowbe-network
      - ai-services-network


###########################################################
# Networks
###########################################################
networks:
  wardrowbe-network:
    driver: bridge

  ai-services-network:
    external: true

  database-admin-network:
    external: true