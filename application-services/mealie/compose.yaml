services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    container_name: mealie
    restart: unless-stopped
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      TZ: ${TZ}
      PUID: "1000"
      PGID: "1000"
      BASE_URL: ${MEALIE_BASE_URL}
      ALLOW_SIGNUP: "false"
      DEFAULT_EMAIL: ${MEALIE_DEFAULT_EMAIL}
      DEFAULT_GROUP: ${MEALIE_DEFAULT_GROUP}
      DEFAULT_HOUSEHOLD: ${MEALIE_DEFAULT_HOUSEHOLD}
      DB_ENGINE: postgres
      POSTGRES_SERVER: mealie-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${MEALIE_DB_NAME}
      POSTGRES_USER: ${MEALIE_DB_USER}
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
    volumes:
      - ${MEALIE_DATA_PATH}:/app/data
    depends_on:
      mealie-postgres:
        condition: service_healthy
    networks:
      - mealie-network
    deploy:
      resources:
        limits:
          memory: 1G

  mealie-postgres:
    image: postgres:17
    container_name: mealie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MEALIE_DB_NAME}
      POSTGRES_USER: ${MEALIE_DB_USER}
      POSTGRES_PASSWORD: ${MEALIE_DB_PASSWORD}
    volumes:
      - ./mealie-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${MEALIE_DB_USER} -d ${MEALIE_DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mealie-network
      - database-admin-network
    deploy:
      resources:
        limits:
          memory: 512M

networks:
  mealie-network:
    driver: bridge
  database-admin-network:
    external: true
