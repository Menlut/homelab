services:
  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: always
    ports:
      - "61208:8090"
    volumes:
      - ./beszel_data:/beszel_data
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

  beszel-agent:
    image: henrygd/beszel-agent-intel
    container_name: beszel-agent
    restart: always
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ${BESZEL_EXTRA_FILESYSTEM}:/extra-filesystems/nas__NAS:ro
    devices:
      - /dev/dri/card0:/dev/dri/card0
      - /dev/sda:/dev/sda
      - /dev/nvme0:/dev/nvme0
    cap_add:
      - CAP_PERFMON
      - SYS_RAWIO
      - SYS_ADMIN
    environment:
      LISTEN: 45876
      KEY: ${BESZEL_AGENT_KEY}
      TOKEN: ${BESZEL_AGENT_TOKEN}
      GPU_COLLECTOR: intel_gpu_top
      INTEL_GPU_DEVICE: drm:/dev/dri/card0
      SMART_DEVICES: /dev/sda,/dev/nvme0
    deploy:
      resources:
        limits:
          memory: 128m
        reservations:
          memory: 64m
